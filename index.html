<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Morrow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a href="/" class="logo">AJ</a>
            <ul class="nav-links">
                <li><a href="#work">Work</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-grid">
            <div class="hero-content">
                <h1 class="hero-title">Build<br>what<br>matters</h1>
                <p class="hero-tagline">Software engineer & maker</p>
            </div>
            <div class="hero-visual">
                <svg viewBox="0 0 600 500" class="mountain-landscape" aria-hidden="true">
                    <!-- Background peak - furthest -->
                    <polygon
                        class="peak peak-back"
                        points="50,500 250,180 450,500"
                    />
                    <!-- Middle peak - accent color -->
                    <polygon
                        class="peak peak-accent"
                        points="200,500 380,100 560,500"
                    />
                    <!-- Foreground peak - darkest -->
                    <polygon
                        class="peak peak-front"
                        points="0,500 180,220 360,500"
                    />
                    <!-- Geometric accent line -->
                    <line
                        class="accent-line"
                        x1="380" y1="100"
                        x2="600" y2="100"
                    />
                </svg>
            </div>
        </div>
        <div class="hero-scroll-indicator">
            <span class="scroll-text">Scroll</span>
            <span class="scroll-line"></span>
        </div>
    </section>

    <main>
        <section id="work" class="section">
            <div class="section-header">
                <span class="section-number">01</span>
                <h2>Selected Work</h2>
            </div>
            <div class="content-placeholder">
                <p>Projects and case studies</p>
            </div>
        </section>

        <section id="about" class="section">
            <div class="section-header">
                <span class="section-number">02</span>
                <h2>About</h2>
            </div>
            <div class="content-placeholder">
                <p>Background and expertise</p>
            </div>
        </section>

        <section id="contact" class="section">
            <div class="section-header">
                <span class="section-number">03</span>
                <h2>Contact</h2>
            </div>
            <div class="content-placeholder">
                <p>Get in touch</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span>2026</span>
    </footer>
</body>
</html>
