<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morrow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a href="/" class="logo">MORROW</a>
            <ul class="nav-links">
                <li><a href="#work">Work</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-grid">
            <div class="hero-content">
                <h1 class="hero-title">Design.<br>Build.<br>Ship.</h1>
                <p class="hero-tagline">Engineering that moves mountains.</p>
            </div>
            <div class="hero-visual">
                <svg viewBox="0 0 480 400" class="mountain-landscape" aria-hidden="true">
                    <!-- Construction grid - engineering reference -->
                    <line class="grid-line" x1="240" y1="0" x2="240" y2="400" />
                    <line class="grid-line grid-line-h" x1="0" y1="240" x2="480" y2="240" />

                    <!-- Primary peak - bold geometric form -->
                    <polygon
                        class="peak peak-primary"
                        points="40,400 240,60 440,400"
                    />

                    <!-- Secondary peak - overlapping depth -->
                    <polygon
                        class="peak peak-secondary"
                        points="120,400 280,140 440,400"
                    />

                    <!-- Accent marker - summit point -->
                    <circle class="summit-marker" cx="240" cy="60" r="6" />
                </svg>
            </div>
        </div>
        <div class="hero-scroll-indicator">
            <span class="scroll-text">Scroll</span>
            <span class="scroll-line"></span>
        </div>
    </section>

    <main>
        <section id="work" class="section">
            <div class="section-header">
                <span class="section-number">01</span>
                <h2>Selected Work</h2>
            </div>
            <div class="content-placeholder">
                <p>Projects and case studies</p>
            </div>
        </section>

        <section id="about" class="section">
            <div class="section-header">
                <span class="section-number">02</span>
                <h2>About</h2>
            </div>
            <div class="content-placeholder">
                <p>Background and expertise</p>
            </div>
        </section>

        <section id="contact" class="section">
            <div class="section-header">
                <span class="section-number">03</span>
                <h2>Contact</h2>
            </div>
            <div class="content-placeholder">
                <p>Get in touch</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span>2026</span>
    </footer>
</body>
</html>
